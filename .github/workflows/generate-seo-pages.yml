name: Generate RAPAT SEO Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'scripts/generate-seo-pages.mjs'
      - 'gig-config.js'
      - '.github/workflows/generate-seo-pages.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate service-location SEO pages
        run: node scripts/generate-seo-pages.mjs

      - name: Commit generated pages
        run: |
          if git diff --quiet -- servis sitemap.xml; then
            echo "No SEO page changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servis sitemap.xml
          git commit -m "refresh RAPAT service location SEO pages"
          git push
