name: RAPAT Mobile Build

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-app
    paths:
      - 'mobile/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'freelance.js'
      - '.github/workflows/mobile-build.yml'

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web bundle
        run: npm run mobile:prepare
      - name: Add Android platform
        run: npx cap add android
      - name: Sync and configure Android
        run: |
          npx cap sync android
          npm run mobile:configure
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rapat-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Prepare web bundle
        run: npm run mobile:prepare
      - name: Add iOS platform
        run: npx cap add ios
      - name: Sync and configure iOS
        run: |
          npx cap sync ios
          npm run mobile:configure
      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        run: |
          cd ios/build/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app rapat-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rapat-ios-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/rapat-ios-simulator.zip
