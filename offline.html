<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06245f">
  <title>RAPAT — Tiada Sambungan Internet</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f9fc;color:#06245f;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,520px);background:#fff;border:1px solid #e3e8ef;border-radius:22px;padding:32px;box-shadow:0 18px 50px rgba(11,29,66,.09)}.logo{font-size:30px;font-weight:900;letter-spacing:-1px;margin-bottom:24px}.red{color:#e53935}.yellow{color:#d9a900}h1{font-size:25px;line-height:1.2;margin:0 0 10px}p{margin:0 0 22px;color:#526078;line-height:1.65;font-size:14px}button{appearance:none;border:0;border-radius:12px;padding:13px 18px;background:#06245f;color:#fff;font:inherit;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">RA<span class="red">P</span><span class="yellow">A</span>T</div>
    <h1>Internet tidak dapat dikesan.</h1>
    <p>RAPAT perlukan sambungan internet untuk memaparkan maklumat servis dan peluang terkini. Cuba semula apabila sambungan anda kembali.</p>
    <button type="button" onclick="location.reload()">Cuba Semula</button>
  </main>
</body>
</html>
